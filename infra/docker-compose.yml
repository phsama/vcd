name: vcd-local

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vcd
      POSTGRES_PASSWORD: vcd_local
      POSTGRES_DB: vcd
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcd"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local (espelha Cloudflare R2 em produção — mesmo SDK S3)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vcd
      MINIO_ROOT_PASSWORD: vcd_local_minio
    volumes:
      - minio_data:/data

  # cria os buckets na subida
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 vcd vcd_local_minio;
      mc mb -p local/vcd-audio local/vcd-cards local/vcd-exports;
      mc anonymous set download local/vcd-audio local/vcd-cards;
      exit 0"

  # SMTP de desenvolvimento — captura todos os emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg_data:
  redis_data:
  minio_data:
