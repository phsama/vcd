name: CI — API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vcd
          POSTGRES_PASSWORD: vcd_ci
          POSTGRES_DB: vcd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vcd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vcd:vcd_ci@localhost:5432/vcd_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-value
      JOURNAL_MASTER_KEY: ci-only-master-key-value
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcd/api prisma:generate
      - run: pnpm --filter @vcd/api prisma validate
      - run: pnpm --filter @vcd/api typecheck
      - run: pnpm --filter @vcd/api build
      - name: Migrations + seed no banco de teste
        run: |
          pnpm --filter @vcd/api prisma:migrate:deploy
          pnpm --filter @vcd/api db:seed
      - name: Testes e2e
        run: pnpm --filter @vcd/api test:e2e
      - name: Verificar geração do contrato OpenAPI
        run: pnpm --filter @vcd/api contracts:generate
